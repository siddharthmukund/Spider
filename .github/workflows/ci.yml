name: CI

on: [push, pull_request]

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt
      
      - name: Run tests with coverage (headless)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y xvfb
            xvfb-run -s "-screen 0 1920x1080x24" pytest --cov=. --cov-report=xml --cov-report=term-missing --cov-fail-under=70
          else
            pytest --cov=. --cov-report=xml --cov-report=term-missing --cov-fail-under=70
          fi
        shell: bash
      
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: true
  
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety
      
      - name: Run Bandit security scan
        run: |
          bandit -r . -ll -ii -f json -o bandit-report.json || true
          bandit -r . -ll -ii
      
      - name: Run Safety dependency check
        run: |
          safety check --json --output safety-report.json || true
          safety check
      
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json

  viewer-e2e:
    name: Viewer E2E tests
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run viewer E2E (headless)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          xvfb-run -s "-screen 0 1920x1080x24" pytest -q \
            tests/test_report_viewer_filters.py::test_pagination_filter_and_export \
            tests/test_report_viewer_export.py::test_save_snapshot_and_export_csv \
            tests/test_viewer_e2e_ci.py::test_open_exported_and_snapshot_e2e \
            tests/test_accessibility.py::test_tab_order_and_accessible_descriptions \
            tests/test_accessibility_keyboard.py::test_tab_navigation_and_shortcuts -q

  verify-macos-artifact:
    name: Verify macOS artifact
    runs-on: macos-latest
    needs: package-macos
    steps:
      - uses: actions/checkout@v4
      - name: Download artifact
        uses: actions/download-artifact@v3
        with:
          name: seo-crawler-macos
          path: ./artifacts
      - name: Verify .app bundle
        run: |
          set -e
          ls -la artifacts
          APP=$(ls artifacts | grep ".app" | head -n1)
          if [ -z "$APP" ]; then
            echo "No .app found"; exit 1
          fi
          echo "Found app: $APP"
          if [ ! -f "artifacts/$APP/Contents/Info.plist" ]; then
            echo "Info.plist missing"; exit 1
          fi
          echo "Info.plist exists"
      - name: Run artifact verification script
        run: |
          python3 scripts/verify_macos_artifact.py ./artifacts

  # Integration tests: run Redis + Celery worker and execute integration tests
  integration:
    name: Integration (Redis + Celery)
    runs-on: ubuntu-latest
    needs: test
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r webapp/requirements.txt
      - name: Start celery worker
        env:
          REDIS_URL: redis://localhost:6379/0
        run: |
          nohup celery -A webapp.tasks worker --loglevel=info > celery.log 2>&1 &
          sleep 5
      - name: Run integration tests
        env:
          REDIS_URL: redis://localhost:6379/0
          USE_CELERY: '1'
          RUN_CELERY_INTEGRATION: '1'
        run: pytest tests/test_celery_integration.py -q

  package-macos:
    name: macOS package
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Package with PyInstaller
        run: |
          # Provide optional env vars: ICON, BUNDLE_ID, VERSION, MAKE_DMG
          bash scripts/package_mac.sh "$ENTRY_POINT" "$APP_NAME" "$ICON" "$BUNDLE_ID" "$VERSION" "$MAKE_DMG"
      - name: Optional codesign & notarize
        if: ${{ secrets.MACOS_SIGN_ID != '' }}
        env:
          MACOS_SIGN_ID: ${{ secrets.MACOS_SIGN_ID }}
          NOTARY_PROFILE: ${{ secrets.NOTARY_PROFILE }}
        run: |
          bash scripts/sign_and_notarize.sh dist
      - name: Run artifact verification script
        run: |
          python3 scripts/verify_macos_artifact.py dist
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: seo-crawler-macos
          path: dist/**

  build-swift-macos:
    name: Build Swift macOS App
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Print Xcode version
        run: xcodebuild -version
      - name: Build SwiftUI app (release)
        run: |
          cd swift/SEOCrawlerApp
          swift build -c release
      - name: Create .app bundle
        run: |
          EXEC=$(swift build -c release --show-bin-path)/SEOCrawlerApp
          scripts/create_macos_app.sh "$EXEC"
      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: SEOCrawlerApp-macos
          path: dist/**

