version: '3.8'
services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  web:
    build: .
    command: uvicorn webapp.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./:/app
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - USE_CELERY=1
  celery:
    build: .
    command: celery -A webapp.tasks worker --loglevel=info
    volumes:
      - ./:/app
    environment:
      - REDIS_URL=redis://redis:6379/0
